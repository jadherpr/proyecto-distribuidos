services:
  server:
    build: ./server
    container_name: ${GROUP_NAME:-g2}-server
    environment:
      GROUP_NAME: ${GROUP_NAME:-g2}
      PUBLIC_URL: ${PUBLIC_URL:-http://server:8000}
      CENTRAL_URL: ${CENTRAL_URL:-http://central:9000}
      PORT: 8000
      DB_PATH: /data/chat.db
      REGISTER_INTERVAL: ${REGISTER_INTERVAL:-30}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-5}
      HEARTBEAT_MAX_FAILS: ${HEARTBEAT_MAX_FAILS:-3}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - server-data:/data
    restart: unless-stopped

  central:
    build: ./mock_central
    container_name: mock-central
    profiles: ["local"]
    ports:
      - "9000:9000"
    restart: unless-stopped

  server-b:
    build: ./server
    container_name: ${GROUP_NAME:-g2}-server-b
    profiles: ["local"]
    environment:
      GROUP_NAME: ${GROUP_NAME_B:-g2b}
      PUBLIC_URL: http://server-b:8000
      CENTRAL_URL: http://central:9000
      PORT: 8000
      DB_PATH: /data/chat.db
    ports:
      - "8001:8000"
    volumes:
      - server-b-data:/data
    restart: unless-stopped

volumes:
  server-data:
  server-b-data:
